<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disney+ Streaming Picker</title>
  <!-- Vollständiges Manifest mit korrekten Screenshot-Daten -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22id%22%3A%22%2Fstreaming-picker%2F%22%2C%22name%22%3A%22Disney%2B%20Streaming%20Picker%22%2C%22short_name%22%3A%22Disney%2B%20Picker%22%2C%22description%22%3A%22Finde%20den%20perfekten%20Film%20oder%20die%20perfekte%20Serie%20auf%20Disney%2B%20per%20Zufall.%22%2C%22start_url%22%3A%22.%2Findex.html%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22portrait%22%2C%22background_color%22%3A%22%2308102b%22%2C%22theme_color%22%3A%22%230078d4%22%2C%22categories%22%3A%5B%22entertainment%22%2C%22lifestyle%22%2C%22utilities%22%5D%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F3172%2F3172555.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%2C%22screenshots%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fraw.githubusercontent.com%2Fdaviddoering07-cmd%2FDisney-streaming-picker%2Fmain%2FScreenshot%25202026-08-16%2520121559.png%22%2C%22sizes%22%3A%221919x915%22%2C%22type%22%3A%22image%2Fpng%22%2C%22form_factor%22%3A%22wide%22%7D%5D%7D">
  
  <style>
    :root {
      --disney-card: rgba(11, 18, 38, 0.85);
      --disney-blue: #0078d4;
      --disney-glow: rgba(0, 120, 212, 0.4);
      --text-main: #f9f9f9;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 20px;
      background: linear-gradient(180deg, #12214e 0%, #0c1738 40%, #060c20 80%, #030612 100%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container { width: 100%; max-width: 440px; }
    header { text-align: center; margin-bottom: 24px; }
    .disney-logo-container { position: relative; display: inline-block; margin-bottom: 6px; }
    .disney-logo { font-family: sans-serif; font-size: 38px; font-weight: 900; letter-spacing: -1px; color: #ffffff; text-shadow: 0 0 20px rgba(255, 255, 255, 0.4); margin: 0; }
    .disney-logo span { font-size: 38px; vertical-align: super; font-weight: 300; }
    .disney-arc { position: absolute; top: -12px; left: 12%; width: 76%; height: 25px; border: 3px solid transparent; border-top-color: #60a5fa; border-radius: 50% 50% 0 0/ 100% 100% 0 0; filter: drop-shadow(0 0 8px #0078d4); }
    header p { margin: 4px 0 0 0; color: var(--text-muted); font-size: 13px; }
    .card { background-color: var(--disney-card); backdrop-filter: blur(10px); padding: 24px; border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7); }
    .form-group { margin-bottom: 20px; position: relative; }
    label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; color: var(--text-muted); }
    .type-toggle { display: flex; background: #060c20; padding: 4px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08); gap: 4px; }
    .toggle-btn { flex: 1; padding: 10px; background: transparent; color: var(--text-muted); border: none; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .toggle-btn.active { background-color: var(--disney-blue); color: #ffffff; box-shadow: 0 0 12px var(--disney-glow); }
    input[type="text"] { width: 100%; padding: 12px 14px; background-color: #060c20; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; color: var(--text-main); }
    #drawBtn { width: 100%; padding: 14px; background: linear-gradient(135deg, #0078d4 0%, #004b87 100%); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 4px; }
    .result-box { margin-top: 22px; padding: 18px; background-color: #060c20; border: 1px solid var(--disney-blue); border-radius: 14px; text-align: center; }
    .hidden { display: none; }
    .badge { display: inline-block; background-color: var(--disney-blue); color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 4px; margin-bottom: 10px; }
    .stream-btn { display: flex; align-items: center; justify-content: center; margin-top: 14px; padding: 12px; background: linear-gradient(135deg, #0078d4 0%, #00d2d3 100%); color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="disney-logo-container">
        <div class="disney-arc"></div>
        <h1 class="disney-logo">Disney<span>+</span></h1>
      </div>
      <p>Streaming Picker & Zufallsgenerator</p>
    </header>
    <main class="card">
      <div class="form-group">
        <label>1. WAS MÖCHTEST DU SCHAUEN?</label>
        <div class="type-toggle">
          <button type="button" class="toggle-btn" data-type="ALL">Alles</button>
          <button type="button" class="toggle-btn active" data-type="Film">🎬 Film</button>
          <button type="button" class="toggle-btn" data-type="Serie">📺 Serie</button>
        </div>
      </div>
      <div class="form-group">
        <label>2. GENRE SUCHEN</label>
        <input type="text" id="genreSearch" placeholder="🔍 Genre eintippen..." autocomplete="off" />
        <div id="genreSuggestions" class="suggestions-box hidden"></div>
      </div>
      <button id="drawBtn">🎲 Zufälligen Titel finden</button>
      <div id="resultContainer" class="result-box hidden">
        <span class="badge" id="resType">FILM</span>
        <h2 id="resTitle">Titel</h2>
        <a id="streamLink" href="#" class="stream-btn">✨ In Disney+ App öffnen</a>
      </div>
    </main>
  </div>
  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.log('SW fail', err)); }); }
    const catalog = [{"Nr.":1,"Titel (Cover / Deutsch)":"Fast & Furious 7","Originaltitel / International":"Furious 7","Typ (Film / Serie)":"Film / Kurzfilm","Franchise / Studio":"Fast & Furious","Genre / Kategorie":"Action / Thriller"}];
    let selectedType = "Film";
    let selectedGenre = "ALL";
    let currentTitle = "";
    document.querySelectorAll('.toggle-btn').forEach(btn => btn.addEventListener('click', (e) => {
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      selectedType = e.target.getAttribute('data-type');
    }));
    document.getElementById('drawBtn').addEventListener('click', () => {
      const pick = catalog[Math.floor(Math.random() * catalog.length)];
      currentTitle = pick['Titel (Cover / Deutsch)'];
      document.getElementById('resTitle').textContent = currentTitle;
      document.getElementById('resultContainer').classList.remove('hidden');
    });
    document.getElementById('streamLink').addEventListener('click', function(e) {
      e.preventDefault();
      const encoded = encodeURIComponent(currentTitle);
      window.location.href = `disneyplus://search?q=${encoded}`;
      setTimeout(() => { window.location.href = `https://www.disneyplus.com/search?q=${encoded}`; }, 1200);
    });
  </script>
</body>
</html>
